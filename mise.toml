[tools]
zig = "0.16.0"          # GhosttyKit (libghostty) build
swiftformat = "0.58"
swiftlint = "0.61"

[env]
BUILD_DIR = "{{config_root}}/build"
# The upstream Ghostty commit GhosttyKit is built from, the same one heed pins. ghostty.h is Ghostty's internal
# embedding API, so bump this deliberately and fix Sources/SillTerminal in the same commit.
GHOSTTY_COMMIT = "1e9e14af5df14211892f5fc15fd21a49c7d94868"

[tasks.doctor]
description = "Check the toolchain: Xcode selected, its licence, the Metal toolchain, Zig, nvim"
run = "scripts/doctor.sh"

[tasks.ghostty]
description = "Build Vendor/GhosttyKit.xcframework from Ghostty at $GHOSTTY_COMMIT"
run = "scripts/ghostty.sh"
sources = ["mise.toml", "scripts/ghostty.sh"]
outputs = ["Vendor/GhosttyKit.xcframework/Info.plist"]

[tasks.build]
description = "Debug build and assemble build/Sill.app"
run = ["swift build", "scripts/bundle.sh debug"]

[tasks.dev]
description = "Build and launch Sill.app"
depends = ["build"]
run = "open $BUILD_DIR/Sill.app"

[tasks.test]
description = "Swift Testing suite (the nvim tests start a real `nvim --embed`)"
run = "swift test --quiet"

[tasks.fmt]
description = "Format Swift sources"
run = "swiftformat Sources Tests Package.swift"

[tasks.lint]
description = "Check formatting and lint"
run = ["swiftformat Sources Tests Package.swift --lint", "swiftlint lint --quiet Sources Tests"]

[tasks.bench]
description = "The grid's go/no-go numbers at 4K, on a release build"
depends = ["bundle"]
run = "SILL_BENCH=1 $BUILD_DIR/Sill.app/Contents/MacOS/Sill"

[tasks.bundle]
description = "Release build, ad-hoc signed build/Sill.app"
run = ["swift build -c release", "scripts/bundle.sh release"]
