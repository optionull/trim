<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 954 266" width="954" height="266" style="--bg:#1a1b26;--fg:#a9b1d6;--line:#858EB5;--accent:#7aa2f7;--muted:#7982aa;background:var(--bg)">
<style>
  text { font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif; }
  .mono { font-family: ui-monospace, 'SF Mono', 'Cascadia Code', monospace; }
  svg {
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 72%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 64%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 30%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 50%, var(--bg)));
    --_line-soft:     color-mix(in srgb, var(--fg) 14%, var(--bg));
    --_line-strong:   color-mix(in srgb, var(--fg) 68%, var(--bg));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 70%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 10%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 22%, var(--bg)));
    --_group-fill:    color-mix(in srgb, var(--fg) 4%, var(--bg));
    --_group-hdr:     color-mix(in srgb, var(--accent, var(--fg)) 15%, var(--bg));
    --_group-stroke:  color-mix(in srgb, var(--fg) 10%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 12%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 9%, var(--bg));
    --_accent-fill:   color-mix(in srgb, var(--accent, var(--fg)) 8%, var(--bg));
    --_accent-stroke: color-mix(in srgb, var(--accent, var(--fg)) 20%, var(--bg));
    --_accent-text:   color-mix(in srgb, var(--accent, var(--fg)) 65%, var(--bg));
    --fs-xs: 0.75rem;
    --fs-s:  0.875rem;
    --fs-m:  1rem;
    --fs-l:  1.125rem;
  }
  .node, .actor, .entity, .class-node, .architecture-service, .kanban-card { filter: drop-shadow(0 1px 2px color-mix(in srgb, color-mix(in srgb, var(--bg) 35%, black) 55%, transparent)); }
  .subgraph, .kanban-column { filter: drop-shadow(0 1px 2px color-mix(in srgb, color-mix(in srgb, var(--bg) 35%, black) 35%, transparent)); }
</style>

<g class="diagram-title">
  <rect x="24" y="33.5" width="9" height="9" rx="2" ry="2" fill="var(--accent, var(--fg))" />
  <text x="40" y="38" text-anchor="start" font-size="var(--fs-l)" font-weight="700" fill="var(--_text)" dy="6.3">Plan</text>
</g>
<rect class="plot-panel" x="24" y="72" width="906" height="138" rx="12" ry="12" fill="var(--_group-fill)" stroke="none" stroke-width="1" />
<g class="gantt-axis">
  <line x1="198" y1="80" x2="198" y2="210" stroke="var(--_line-soft)" stroke-width="1" />
  <text x="198" y="230" text-anchor="middle" font-size="var(--fs-xs)" font-weight="400" fill="var(--_text-muted)" dy="4.2">Jan 1</text>
  <line x1="288" y1="80" x2="288" y2="210" stroke="var(--_line-soft)" stroke-width="1" />
  <text x="288" y="230" text-anchor="middle" font-size="var(--fs-xs)" font-weight="400" fill="var(--_text-muted)" dy="4.2">Jan 3</text>
  <line x1="378" y1="80" x2="378" y2="210" stroke="var(--_line-soft)" stroke-width="1" />
  <text x="378" y="230" text-anchor="middle" font-size="var(--fs-xs)" font-weight="400" fill="var(--_text-muted)" dy="4.2">Jan 5</text>
  <line x1="468" y1="80" x2="468" y2="210" stroke="var(--_line-soft)" stroke-width="1" />
  <text x="468" y="230" text-anchor="middle" font-size="var(--fs-xs)" font-weight="400" fill="var(--_text-muted)" dy="4.2">Jan 7</text>
  <line x1="558" y1="80" x2="558" y2="210" stroke="var(--_line-soft)" stroke-width="1" />
  <text x="558" y="230" text-anchor="middle" font-size="var(--fs-xs)" font-weight="400" fill="var(--_text-muted)" dy="4.2">Jan 9</text>
  <line x1="648" y1="80" x2="648" y2="210" stroke="var(--_line-soft)" stroke-width="1" />
  <text x="648" y="230" text-anchor="middle" font-size="var(--fs-xs)" font-weight="400" fill="var(--_text-muted)" dy="4.2">Jan 11</text>
  <line x1="738" y1="80" x2="738" y2="210" stroke="var(--_line-soft)" stroke-width="1" />
  <text x="738" y="230" text-anchor="middle" font-size="var(--fs-xs)" font-weight="400" fill="var(--_text-muted)" dy="4.2">Jan 13</text>
  <line x1="828" y1="80" x2="828" y2="210" stroke="var(--_line-soft)" stroke-width="1" />
  <text x="828" y="230" text-anchor="middle" font-size="var(--fs-xs)" font-weight="400" fill="var(--_text-muted)" dy="4.2">Jan 15</text>
  <line x1="918" y1="80" x2="918" y2="210" stroke="var(--_line-soft)" stroke-width="1" />
  <text x="918" y="230" text-anchor="middle" font-size="var(--fs-xs)" font-weight="400" fill="var(--_text-muted)" dy="4.2">Jan 17</text>
  <line x1="198" y1="210" x2="918" y2="210" stroke="var(--_line)" stroke-width="1.25" />
</g>
<g class="gantt-section" data-section="0" data-label="A">
  <text x="38" y="100" text-anchor="start" font-size="var(--fs-xs)" font-weight="600" letter-spacing="0.08em" fill="color-mix(in srgb, #7982aa 44%, var(--fg))" dy="4.2">A</text>
  <line x1="61.44" y1="100" x2="184" y2="100" stroke="color-mix(in srgb, #7982aa 42%, var(--bg))" stroke-width="1.25" />
<g class="gantt-task" data-state="planned">
  <text x="38" y="136" text-anchor="start" font-size="var(--fs-s)" font-weight="400" fill="var(--_text)" dy="4.9">Task one</text>
  <rect x="198" y="126" width="450" height="20" rx="6" ry="6" fill="#7982aa" />
</g>
<g class="gantt-task" data-state="planned">
  <text x="38" y="172" text-anchor="start" font-size="var(--fs-s)" font-weight="400" fill="var(--_text)" dy="4.9">Task two</text>
  <rect x="648" y="162" width="225" height="20" rx="6" ry="6" fill="#7982aa" />
</g>
</g>
</svg>