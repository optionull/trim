<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 268" width="300" height="268" style="--bg:#1a1b26;--fg:#a9b1d6;--line:#858EB5;--accent:#7aa2f7;--muted:#7982aa;background:var(--bg)">
<style>
  text { font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif; }
  .mono { font-family: ui-monospace, 'SF Mono', 'Cascadia Code', monospace; }
  svg {
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 72%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 64%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 30%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 50%, var(--bg)));
    --_line-soft:     color-mix(in srgb, var(--fg) 14%, var(--bg));
    --_line-strong:   color-mix(in srgb, var(--fg) 68%, var(--bg));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 70%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 10%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 22%, var(--bg)));
    --_group-fill:    color-mix(in srgb, var(--fg) 4%, var(--bg));
    --_group-hdr:     color-mix(in srgb, var(--accent, var(--fg)) 15%, var(--bg));
    --_group-stroke:  color-mix(in srgb, var(--fg) 10%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 12%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 9%, var(--bg));
    --_accent-fill:   color-mix(in srgb, var(--accent, var(--fg)) 8%, var(--bg));
    --_accent-stroke: color-mix(in srgb, var(--accent, var(--fg)) 20%, var(--bg));
    --_accent-text:   color-mix(in srgb, var(--accent, var(--fg)) 65%, var(--bg));
    --fs-xs: 0.75rem;
    --fs-s:  0.875rem;
    --fs-m:  1rem;
    --fs-l:  1.125rem;
  }
  .node, .actor, .entity, .class-node, .architecture-service, .kanban-card { filter: drop-shadow(0 1px 2px color-mix(in srgb, color-mix(in srgb, var(--bg) 35%, black) 55%, transparent)); }
  .subgraph, .kanban-column { filter: drop-shadow(0 1px 2px color-mix(in srgb, color-mix(in srgb, var(--bg) 35%, black) 35%, transparent)); }
</style>

<path class="class-relationship" data-from="Animal" data-to="Dog" data-type="inheritance" data-marker-at="from" d="M122.33333333333334,132 L122.33333333333334,149 Q122.33333333333334,157 114.33333333333334,157 L98,157 Q90,157 90,165 L90,192" fill="none" stroke="var(--_line)" stroke-width="1.5" marker-start="url(#m5bdf0d43-mk-triangle-s)" />
<path class="class-relationship" data-from="Animal" data-to="Cat" data-type="inheritance" data-marker-at="from" d="M177.66666666666669,132 L177.66666666666669,149 Q177.66666666666669,157 185.66666666666669,157 L202,157 Q210,157 210,165 L210,192" fill="none" stroke="var(--_line)" stroke-width="1.5" marker-start="url(#m5bdf0d43-mk-triangle-s)" />
<g class="class-node" data-id="Animal" data-label="Animal">
  <rect x="67" y="40" width="166" height="92" rx="8" ry="8" fill="var(--bg)" stroke="none" />
  <path d="M67,76 L67,48 Q67,40 75,40 L225,40 Q233,40 233,48 L233,76 Z" fill="url(#m5bdf0d43-eb-p0)" />
  <line x1="67" y1="76" x2="233" y2="76" stroke="color-mix(in srgb, #7982aa 74%, var(--fg))" stroke-width="1.25" />
  <rect x="67" y="40" width="166" height="92" rx="8" ry="8" fill="none" stroke="color-mix(in srgb, #7982aa 74%, var(--fg))" stroke-width="1.25" />
  <line x1="67" y1="104" x2="233" y2="104" stroke="color-mix(in srgb, #7982aa 74%, var(--fg))" stroke-width="1.25" />
  <text x="150" y="58" text-anchor="middle" font-size="var(--fs-m)" font-weight="600" fill="var(--_text)" dy="5.6">Animal</text>
  <text x="83" y="90" class="mono" text-anchor="start" font-size="var(--fs-xs)" font-weight="400" fill="var(--_text-muted)" dy="4.2">String</text>
  <text x="217" y="90" class="mono" text-anchor="end" font-size="var(--fs-s)" font-weight="600" fill="color-mix(in srgb, #7982aa 44%, var(--fg))" dy="4.9">+</text>
  <text x="138.2" y="90" class="mono" text-anchor="start" font-size="var(--fs-s)" font-weight="400" fill="var(--_text)" dy="4.9">name</text>
  <text x="83" y="118" class="mono" text-anchor="start" font-size="var(--fs-xs)" font-weight="400" fill="var(--_text-muted)" dy="4.2">void</text>
  <text x="217" y="118" class="mono" text-anchor="end" font-size="var(--fs-s)" font-weight="600" fill="color-mix(in srgb, #7982aa 44%, var(--fg))" dy="4.9">+</text>
  <text x="138.2" y="118" class="mono" text-anchor="start" font-size="var(--fs-s)" font-weight="400" fill="var(--_text)" dy="4.9">speak()</text>
</g>
<g class="class-node" data-id="Dog" data-label="Dog">
  <rect x="40" y="192" width="100" height="36" rx="8" ry="8" fill="url(#m5bdf0d43-ng-p0)" stroke="color-mix(in srgb, #7982aa 74%, var(--fg))" stroke-width="1.25" />
  <text x="90" y="210" text-anchor="middle" font-size="var(--fs-m)" font-weight="600" fill="var(--_text)" dy="5.6">Dog</text>
</g>
<g class="class-node" data-id="Cat" data-label="Cat">
  <rect x="160" y="192" width="100" height="36" rx="8" ry="8" fill="url(#m5bdf0d43-ng-p0)" stroke="color-mix(in srgb, #7982aa 74%, var(--fg))" stroke-width="1.25" />
  <text x="210" y="210" text-anchor="middle" font-size="var(--fs-m)" font-weight="600" fill="var(--_text)" dy="5.6">Cat</text>
</g>
<defs>
  <linearGradient id="m5bdf0d43-eb-p0" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="color-mix(in srgb, #7982aa 22%, var(--bg))" /><stop offset="1" stop-color="color-mix(in srgb, #7982aa 15%, var(--bg))" /></linearGradient>
  <linearGradient id="m5bdf0d43-ng-p0" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="color-mix(in srgb, #7982aa 15%, var(--bg))" /><stop offset="1" stop-color="color-mix(in srgb, #7982aa 7%, var(--bg))" /></linearGradient>
  <marker id="m5bdf0d43-mk-triangle-s" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="12" refX="0" refY="6" orient="auto">
    <polygon points="10,0.5 0,6 10,11.5" fill="var(--bg)" stroke="var(--_line)" stroke-width="1.25" stroke-linejoin="miter" />
  </marker>
</defs>
</svg>