<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 285.571 366" width="285.571" height="366" style="--bg:#1a1b26;--fg:#a9b1d6;--line:#858EB5;--accent:#7aa2f7;--muted:#7982aa;background:var(--bg)">
<style>
  text { font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif; }
  .mono { font-family: ui-monospace, 'SF Mono', 'Cascadia Code', monospace; }
  svg {
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 72%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 64%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 30%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 50%, var(--bg)));
    --_line-soft:     color-mix(in srgb, var(--fg) 14%, var(--bg));
    --_line-strong:   color-mix(in srgb, var(--fg) 68%, var(--bg));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 70%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 10%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 22%, var(--bg)));
    --_group-fill:    color-mix(in srgb, var(--fg) 4%, var(--bg));
    --_group-hdr:     color-mix(in srgb, var(--accent, var(--fg)) 15%, var(--bg));
    --_group-stroke:  color-mix(in srgb, var(--fg) 10%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 12%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 9%, var(--bg));
    --_accent-fill:   color-mix(in srgb, var(--accent, var(--fg)) 8%, var(--bg));
    --_accent-stroke: color-mix(in srgb, var(--accent, var(--fg)) 20%, var(--bg));
    --_accent-text:   color-mix(in srgb, var(--accent, var(--fg)) 65%, var(--bg));
    --fs-xs: 0.75rem;
    --fs-s:  0.875rem;
    --fs-m:  1rem;
    --fs-l:  1.125rem;
  }
  .node, .actor, .entity, .class-node, .architecture-service, .kanban-card { filter: drop-shadow(0 1px 2px color-mix(in srgb, color-mix(in srgb, var(--bg) 35%, black) 55%, transparent)); }
  .subgraph, .kanban-column { filter: drop-shadow(0 1px 2px color-mix(in srgb, color-mix(in srgb, var(--bg) 35%, black) 35%, transparent)); }
</style>

<line class="lifeline" data-actor="App" x1="74.182" y1="70" x2="74.182" y2="296" stroke="var(--_line-soft)" stroke-width="1.25" stroke-dasharray="4 4" />
<line class="lifeline" data-actor="Win" x1="214.18200000000002" y1="70" x2="214.18200000000002" y2="296" stroke="var(--_line-soft)" stroke-width="1.25" stroke-dasharray="4 4" />
<g class="message" data-from="App" data-to="Win" data-label="open(folder:)" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="74.182" y1="114" x2="214.18200000000002" y2="114" stroke="var(--_line)" stroke-width="1.5" marker-end="url(#m5bdf0d43-mk-arrow)" />
  <rect x="101.08200000000002" y="89.2" width="86.2" height="21.6" rx="10.8" ry="10.8" fill="var(--bg)" stroke="var(--_line)" stroke-width="1.5" /> <text x="144.18" y="100" text-anchor="middle" font-size="var(--fs-xs)" font-weight="500" fill="var(--_text)" dy="4.2">open(folder:)</text>
</g>
<g class="message" data-from="Win" data-to="App" data-label="controller" data-line-style="dashed" data-arrow-head="filled" data-self="false">
  <line x1="214.18200000000002" y1="164" x2="74.182" y2="164" stroke="var(--_line)" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#m5bdf0d43-mk-arrow)" />
  <rect x="108.60600000000002" y="139.2" width="71.15199999999999" height="21.6" rx="10.8" ry="10.8" fill="var(--bg)" stroke="var(--_line)" stroke-width="1.5" /> <text x="144.18" y="150" text-anchor="middle" font-size="var(--fs-xs)" font-weight="500" fill="var(--_text)" dy="4.2">controller</text>
</g>
<g class="sequence-note" data-position="over" data-actors="App,Win">
<g class="note">
  <rect x="44" y="174" width="197.57100000000003" height="38" rx="4" ry="4" fill="color-mix(in srgb, var(--accent, var(--fg)) 9%, var(--bg))" stroke="color-mix(in srgb, var(--accent, var(--fg)) 42%, var(--bg))" stroke-width="1" />
  <rect x="44" y="174" width="3" height="38" fill="var(--accent, var(--fg))" />
  <text x="144.29" y="193" text-anchor="middle" font-size="var(--fs-xs)" font-weight="500" fill="color-mix(in srgb, var(--accent, var(--fg)) 44%, var(--fg))" dy="4.2">one window per folder</text>
</g>
</g>
