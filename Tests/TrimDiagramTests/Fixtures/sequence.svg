  <rect x="172.793" y="296" width="82.77799999999999" height="40" rx="8" ry="8" fill="url(#m5bdf0d43-ng-p0)" stroke="color-mix(in srgb, #7982aa 74%, var(--fg))" stroke-width="1.25" />
  <text x="214.18" y="316" text-anchor="middle" font-size="var(--fs-s)" font-weight="500" fill="var(--_text)" dy="4.9">Window</text>
</g>
<defs>
  <linearGradient id="m5bdf0d43-ng-p0" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="color-mix(in srgb, #7982aa 15%, var(--bg))" /><stop offset="1" stop-color="color-mix(in srgb, #7982aa 7%, var(--bg))" /></linearGradient>
  <marker id="m5bdf0d43-mk-arrow" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="12" refX="10" refY="6" orient="auto">
    <polygon points="0,1.5 10,6 0,10.5" fill="var(--_line)" stroke="var(--_line)" stroke-width="1" stroke-linejoin="miter" />
  </marker>
</defs>
</svg>