  <rect x="30" y="296" width="88.364" height="40" rx="8" ry="8" fill="url(#m5bdf0d43-ng-p0)" stroke="color-mix(in srgb, #7982aa 74%, var(--fg))" stroke-width="1.25" />
  <text x="74.18" y="316" text-anchor="middle" font-size="var(--fs-s)" font-weight="500" fill="var(--_text)" dy="4.9">TrimApp</text>
</g>
