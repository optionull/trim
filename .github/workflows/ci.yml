name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Lint, the tests and a release build: what `mise run lint test bundle` does locally.
  build:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup

      - name: Lint
        run: mise run lint

      # A test waiting forever (a socket that never answers) fails it within the minute each suite allows; this is
      # the backstop, well under the job's limit.
      - name: Test
        timeout-minutes: 10
        run: mise run test

      - name: Release build
        run: mise run bundle
