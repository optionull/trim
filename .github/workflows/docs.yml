name: docs

# The docs (docs-builder) with the landing page over their home page, published to GitHub Pages at
# https://trim.optionull.app/ (the root of the domain, so no
# path prefix). scripts/docs.sh builds the same thing locally (mise run docs).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  docs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v5

      - name: Build documentation
        uses: elastic/docs-builder@main
        env:
          # The design-system layout is behind a feature flag, read from the environment only.
          FEATURE_NAVIGATION_PREVIEW: true

      # The same post-build step as scripts/docs.sh: theme, header logo, landing page, robots.txt.
      - name: Theme and landing page
        run: scripts/docs-finish.sh .artifacts/docs/html

      - name: Setup Pages
        uses: actions/configure-pages@v6.0.0

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: .artifacts/docs/html

      - name: Deploy artifact
        id: deployment
        uses: actions/deploy-pages@v4
